<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101A17">
<title>Bütçe</title>
<style>
:root{
  --bg:#EEEFEA;
  --surface:#FFFFFF;
  --ink:#101A17;
  --ink2:#42504B;
  --ink3:#7C8A84;
  --line:#DCDED7;
  --gold:#A8812B;
  --gold-soft:#EFE3C6;
  --green:#2E6B50;
  --green-soft:#DCEAE1;
  --red:#A23A30;
  --red-soft:#F3DCD9;
  --blue:#2C5673;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:560px;margin:0 auto;padding:0 14px calc(88px + env(safe-area-inset-bottom));}
header{
  position:sticky;top:0;z-index:40;margin:0 -14px 14px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:var(--ink);color:#F4F5F2;
}
.hd-row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.hd-title{font-size:13px;letter-spacing:.02em;color:#9AA8A2;margin:0}
.hd-period{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:1px 0 0}
.hd-dates{font-size:12px;color:#8A9992;margin-top:1px}
select.periodsel{
  background:#1D2B26;color:#F4F5F2;border:1px solid #2E3F39;border-radius:8px;
  padding:8px 10px;font-size:13px;max-width:52%;font-family:inherit;
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:15px;font-weight:600;margin:0 0 10px;letter-spacing:-.01em}
.card h3{font-size:13px;font-weight:600;color:var(--ink2);margin:16px 0 8px}
.sub{font-size:12.5px;color:var(--ink3);margin:0 0 10px}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.grow{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}
.big{font-size:26px;font-weight:600;letter-spacing:-.02em}
.mid{font-size:17px;font-weight:600}
.lbl{font-size:12.5px;color:var(--ink3)}
.pos{color:var(--green)}.neg{color:var(--red)}.gold{color:var(--gold)}
input,select,textarea,button{font-family:inherit;font-size:15px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#FBFBF9;color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
label.f{display:block;margin-bottom:9px}
label.f>span{display:block;font-size:12.5px;color:var(--ink3);margin-bottom:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
button{cursor:pointer;border:none;border-radius:8px;padding:10px 14px;font-weight:600;background:var(--ink);color:#fff}
button:active{opacity:.8}
button.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);font-weight:500}
button.slim{padding:6px 10px;font-size:13px;font-weight:500}
button.danger{background:var(--red)}
button.wide{width:100%}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.bar{height:7px;background:#E7E8E2;border-radius:4px;overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;background:var(--green);border-radius:4px}
.bar>i.warn{background:var(--gold)}
.bar>i.over{background:var(--red)}
.catrow{padding:9px 0;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:none}
.catname{font-size:14px;font-weight:500}
.catnums{font-size:12.5px;color:var(--ink3);white-space:nowrap}
.item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.item:last-child{border-bottom:none}
.item .d{font-size:12px;color:var(--ink3);width:46px;flex:none;padding-top:2px}
.item .t{flex:1;min-width:0}
.item .t b{font-weight:500;font-size:14px;display:block}
.item .t small{color:var(--ink3);font-size:12px}
.item .a{text-align:right;font-size:14px;font-weight:600;white-space:nowrap}
.tabs{display:flex;gap:6px;margin-bottom:12px;background:#E4E6E0;padding:3px;border-radius:9px}
.tabs button{flex:1;background:transparent;color:var(--ink2);font-size:13.5px;font-weight:500;padding:7px 4px;border-radius:7px}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,26,23,.10)}
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:rgba(255,255,255,.94);backdrop-filter:saturate(160%) blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
nav button{flex:1;background:none;color:var(--ink3);font-size:11px;font-weight:500;padding:8px 2px 9px;border-radius:0}
nav button.on{color:var(--ink)}
nav button i{display:block;font-size:18px;font-style:normal;line-height:1.25;margin-bottom:1px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:#EDEEE9;color:var(--ink2)}
.tag.g{background:var(--green-soft);color:var(--green)}
.tag.r{background:var(--red-soft);color:var(--red)}
.tag.y{background:var(--gold-soft);color:var(--gold)}
.empty{padding:22px 10px;text-align:center;color:var(--ink3);font-size:13.5px}
.sheet-bg{position:fixed;inset:0;background:rgba(16,26,23,.45);z-index:60;display:none}
.sheet-bg.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--surface);
  border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .22s ease;
}
.sheet.on{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet h2{margin:0 0 12px;font-size:17px}
.sheet-grab{width:36px;height:4px;background:var(--line);border-radius:2px;margin:-6px auto 12px}
.mini{width:100%;height:150px;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink3);margin-top:6px}
.legend s{display:inline-block;width:9px;height:3px;text-decoration:none;vertical-align:middle;margin-right:4px}
.warnbar{background:var(--gold-soft);color:#6B5314;padding:8px 12px;border-radius:8px;font-size:12.5px;margin-bottom:12px}
input.pctin{width:74px;flex:0 0 74px;text-align:right;padding:6px 8px}
table.hold{width:100%;border-collapse:collapse;font-size:13px}
table.hold th{text-align:right;font-weight:500;color:var(--ink3);font-size:11.5px;padding:0 0 6px;border-bottom:1px solid var(--line)}
table.hold th:first-child{text-align:left}
table.hold td{padding:8px 0;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.hold td:first-child{text-align:left;white-space:normal}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0}
.kv{display:grid;grid-template-columns:1fr auto auto;gap:3px 12px;font-size:12.5px;margin-top:7px;align-items:baseline}
.kv>span{white-space:nowrap}
.kv .h{color:var(--ink3)}
.kv .r{text-align:right}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.infobar{background:#E2EBF1;color:#22465D;padding:10px 12px;border-radius:8px;font-size:12.5px;margin-bottom:12px}
.infobar p{margin:0 0 8px}
.infobar button{background:var(--blue)}
.status{border-color:#D9C48F;background:#FBF7EC}
.dnote{font-size:12.5px;color:var(--blue);margin:-4px 0 10px}
.dnote:empty{display:none}
.toast{position:fixed;left:14px;right:14px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:80;max-width:532px;margin:0 auto;
  background:var(--ink);color:#F4F5F2;padding:10px 14px;border-radius:10px;font-size:13.5px;
  opacity:0;transform:translateY(8px);transition:opacity .2s ease,transform .2s ease;pointer-events:none}
.toast.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hd-row">
      <div class="grow">
        <p class="hd-title" id="hdTitle">Dönem bütçesi</p>
        <p class="hd-period" id="hdPeriod">—</p>
        <p class="hd-dates" id="hdDates">—</p>
      </div>
      <select class="periodsel" id="periodSel"></select>
    </div>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>
<nav id="nav">
  <button data-tab="plan"><i>◱</i>Planlama</button>
  <button data-tab="harcama"><i>↓</i>Harcamalar</button>
  <button data-tab="yatirim"><i>↑</i>Yatırımlar</button>
  <button data-tab="ayar"><i>≡</i>Ayarlar</button>
</nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="sheet-grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- kalıcı depolama ---------- */
var KEY='butce_v1', memOnly=false, mem={};
try{localStorage.setItem('__t','1');localStorage.removeItem('__t');}catch(e){memOnly=true;}
function load(){
  try{
    var raw = memOnly ? mem[KEY] : localStorage.getItem(KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){return null;}
}
function save(){
  var raw=JSON.stringify(S);
  if(memOnly){mem[KEY]=raw;return;}
  try{localStorage.setItem(KEY,raw);}catch(e){memOnly=true;mem[KEY]=raw;drawBanner();}
}

/* ---------- varsayılan yapı ---------- */
function defaults(){
  return {
    v:2,
    splitH:60,
    incomes:[{n:'Maaş 1',a:0},{n:'Maaş 2',a:0},{n:'Diğer gelir',a:0}],
    fixed:[{n:'Kira',a:0},{n:'Aidat',a:0},{n:'Krediler',a:0}],
    expenseCats:[
      {id:'mutfak',n:'Mutfak / Market / Yemek',p:28,subs:['Gıda','Temizlik','Dışarıda yemek']},
      {id:'ulasim',n:'Ulaşım / Araba',p:11,subs:['Yakıt','Bakım','Toplu taşıma']},
      {id:'cocuk',n:'Çocuk',p:10,subs:[]},
      {id:'ev',n:'Ev / Tadilat',p:8,subs:[]},
      {id:'faturalar',n:'Faturalar',p:5,subs:['Elektrik','Doğalgaz','İnternet','Su','Telefon','TV']},
      {id:'giyim',n:'Giyim',p:5,subs:[]},
      {id:'saglik',n:'Sağlık',p:5,subs:[]},
      {id:'tatil',n:'Tatil',p:5,subs:[],fund:'fon_tatil'},
      {id:'seyahat',n:'Seyahat',p:4,subs:[],fund:'fon_seyahat'},
      {id:'sigorta',n:'Sigorta / Kasko',p:4,subs:[]},
      {id:'nakit',n:'Nakit kullanım',p:3,subs:[]},
      {id:'acil',n:'Acil durum',p:3,subs:[],fund:'fon_acil'},
      {id:'hediye',n:'Hediye',p:3,subs:[],fund:'fon_hediye'},
      {id:'egitim',n:'Eğitim / Kitap',p:2,subs:[]},
      {id:'eglence',n:'Eğlence',p:2,subs:[]},
      {id:'bagis',n:'Bağış',p:1,subs:[]},
      {id:'bakim',n:'Kişisel bakım',p:1,subs:[]}
    ],
    savingCats:[
      {id:'altin',n:'Fiziki altın',p:70,unit:'gram',subs:[]},
      {id:'bes',n:'BES',p:10,unit:'TL',subs:[{n:'Yunus',p:40},{n:'Dilan',p:40},{n:'Ali',p:20}]},
      {id:'spus',n:'SPUS',p:6,unit:'adet',subs:[]},
      {id:'hlal',n:'HLAL',p:4,unit:'adet',subs:[]},
      {id:'kripto',n:'Kripto',p:5,unit:'adet',subs:[{n:'BTC',p:60},{n:'ETH',p:15},{n:'XRP',p:10},{n:'SOL',p:10},{n:'TON',p:3},{n:'RENDER',p:2}]},
      {id:'bist',n:'BIST',p:5,unit:'lot',subs:[{n:'TUPRS',p:20},{n:'ENJSA',p:20},{n:'BIMAS',p:20},{n:'EKGYO',p:20},{n:'AKSA',p:10},{n:'MAVI',p:10}]}
    ],
    funds:[
      {id:'fon_seyahat',n:'Seyahat fonu',v:'GMSTR.F',src:'seyahat',unit:'adet'},
      {id:'fon_tatil',n:'Tatil fonu',v:'GLDTR.F',src:'tatil',unit:'adet'},
      {id:'fon_acil',n:'Acil fonu',v:'Gram altın (İş Bankası)',src:'acil',unit:'gram'},
      {id:'fon_hediye',n:'Hediye fonu',v:'Altın S.1 (İş Bankası)',src:'hediye',unit:'adet'},
      {id:'fon_artan',n:'Harcamadan artan',v:'XAU/USDT',src:'artan',unit:'ons'}
    ],
    accounts:defaultAccounts(),
    lastAcc:{h:'',y:''},
    priceLog:[],
    lastUsdAt:'',
    plans:{},
    expenses:[],
    invests:[],
    prices:{},
    lastUsd:0,
    tab:'plan',
    curPeriod:null
  };
}
var DATA_V=2;
function clone(o){return JSON.parse(JSON.stringify(o));}
function defaultAccounts(){
  return [
    {id:'a_garanti',n:'Garanti Bonus',t:'kart'},
    {id:'a_wings',n:'Wings',t:'kart'},
    {id:'a_vakif',n:'Vakıf',t:'kart'},
    {id:'a_kampus',n:'Kampüs Kart',t:'kart'},
    {id:'a_paraf',n:'Paraf',t:'kart'},
    {id:'a_isbank',n:'İş Bankası',t:'kart'},
    {id:'a_ziraat',n:'Ziraat',t:'kart'},
    {id:'a_ykb',n:'Yapı Kredi',t:'kart'}
  ];
}
/* Eski sürüm verisini yeni alanlarla tamamlar. Hiçbir kaydı silmez.
   Sürüm 1 verisinin ilk hali bir kez KEY+'_eski' anahtarına kopyalanır. */
function migrate(d){
  var eski=(d.v||1)<2;
  if(eski && !memOnly){
    try{ if(!localStorage.getItem(KEY+'_eski')) localStorage.setItem(KEY+'_eski',JSON.stringify(d)); }catch(e){}
  }
  if(!d.plans) d.plans={};
  if(!d.expenses) d.expenses=[];
  if(!d.invests) d.invests=[];
  if(!d.prices) d.prices={};
  if(!Array.isArray(d.accounts)) d.accounts=defaultAccounts();
  if(!d.lastAcc) d.lastAcc={h:'',y:''};
  if(!Array.isArray(d.priceLog)) d.priceLog=[];
  if(d.lastUsdAt===undefined) d.lastUsdAt='';
  if(eski){
    /* Eski sürümde onay adımı yoktu. Kullanılmış dönemler onaylı sayılır. */
    var tp=periodIdOf(today()), ust=(d.curPeriod&&d.curPeriod>tp)?d.curPeriod:tp;
    Object.keys(d.plans).forEach(function(pid){
      if(pid<=ust){ d.plans[pid].approved=true; if(!d.plans[pid].approvedAt) d.plans[pid].approvedAt=''; }
    });
  }
  /* Birikim alt oranları artık her dönem planında ayrı saklanır. */
  Object.keys(d.plans).forEach(function(pid){
    var p=d.plans[pid];
    if(!p.subs){ p.subs={}; (d.savingCats||[]).forEach(function(c){ p.subs[c.id]=clone(c.subs||[]); }); }
  });
  d.v=DATA_V;
  return d;
}
var S = load();
if(!S || !S.v) S=defaults();
migrate(S);
save();

/* ---------- dönem hesabı ---------- */
var AYLAR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
function pad(n){return n<10?'0'+n:''+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return iso(new Date());}
// Dönem: ayın 16'sında başlar, ertesi ayın 15'inde biter. Maaş bitiş günü alınır.
// Adı bitiş ayından gelir. 16 Eylül – 15 Ekim arası Ekim bütçesidir.
function periodIdOf(dateStr){
  var d=new Date(dateStr+'T12:00:00');
  var y=d.getFullYear(), m=d.getMonth();
  if(d.getDate()<16){ m-=1; if(m<0){m=11;y-=1;} }
  return y+'-'+pad(m+1);
}
function periodInfo(pid){
  var y=+pid.split('-')[0], m=+pid.split('-')[1]-1;
  var start=new Date(y,m,16,12), end=new Date(y,m+1,15,12);
  return {id:pid,start:iso(start),end:iso(end),
    label:AYLAR[end.getMonth()]+' '+end.getFullYear(),
    dates:start.getDate()+' '+AYLAR[start.getMonth()]+' – '+end.getDate()+' '+AYLAR[end.getMonth()]+' '+end.getFullYear()};
}
function shiftPeriod(pid,k){
  var y=+pid.split('-')[0], m=+pid.split('-')[1]-1+k;
  var d=new Date(y,m,16,12);
  return d.getFullYear()+'-'+pad(d.getMonth()+1);
}
function curPid(){
  if(!S.curPeriod) S.curPeriod=periodIdOf(today());
  return S.curPeriod;
}

/* ---------- plan ---------- */
function getPlan(pid,create){
  if(S.plans[pid]) return S.plans[pid];
  if(!create) return null;
  var prevIds=Object.keys(S.plans).sort();
  var base=null;
  for(var i=prevIds.length-1;i>=0;i--){ if(prevIds[i]<pid){ base=S.plans[prevIds[i]]; break; } }
  var p = base ? clone(base) : {
    splitH:S.splitH,
    incomes:clone(S.incomes),
    fixed:clone(S.fixed),
    ec:S.expenseCats.map(function(c){return {id:c.id,p:c.p};}),
    sc:S.savingCats.map(function(c){return {id:c.id,p:c.p};}),
    subs:templateSubs()
  };
  if(!p.subs) p.subs=templateSubs();
  p.approved=false; p.approvedAt='';
  S.plans[pid]=p; save();
  return p;
}
function templateSubs(){ var o={}; S.savingCats.forEach(function(c){ o[c.id]=clone(c.subs||[]); }); return o; }
/* Birikim alt oranları dönem planından okunur. Planda yoksa kategori şablonu kullanılır. */
function planSubs(p,catId){
  if(p && p.subs && p.subs[catId]) return p.subs[catId];
  var m=savById(catId); return (m&&m.subs)||[];
}
function latestApproved(){
  var ks=Object.keys(S.plans).filter(function(k){return S.plans[k].approved;}).sort();
  return ks.length?ks[ks.length-1]:'';
}
function catById(id){ for(var i=0;i<S.expenseCats.length;i++) if(S.expenseCats[i].id===id) return S.expenseCats[i]; return null; }
function savById(id){ for(var i=0;i<S.savingCats.length;i++) if(S.savingCats[i].id===id) return S.savingCats[i]; return null; }
function fundById(id){ for(var i=0;i<S.funds.length;i++) if(S.funds[i].id===id) return S.funds[i]; return null; }
function sum(arr,f){var t=0;for(var i=0;i<arr.length;i++)t+=(f?f(arr[i]):arr[i])||0;return t;}
function numsOf(p){
  var gelir=sum(p.incomes,function(x){return +x.a;});
  var sabit=sum(p.fixed,function(x){return +x.a;});
  var kalan=gelir-sabit;
  var hb=kalan*p.splitH/100, bb=kalan*(100-p.splitH)/100;
  return {p:p,gelir:gelir,sabit:sabit,kalan:kalan,hb:hb,bb:bb};
}
function planNums(pid){ return numsOf(getPlan(pid,true)); }
/* Raporlar için. Planı olmayan döneme plan açmaz, null döner. */
function planNumsRO(pid){ return S.plans[pid]?numsOf(S.plans[pid]):null; }
/* ---------- biçimlendirme ---------- */
var nf0=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:0});
var nf2=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
var nf4=new Intl.NumberFormat('tr-TR',{maximumFractionDigits:4});
function tl(n){return nf0.format(Math.round(n||0))+' ₺';}
function tl2(n){return nf2.format(n||0)+' ₺';}
function usd(n){return '$'+nf2.format(n||0);}
function qty(n){return nf4.format(n||0);}
function pct(n){return (Math.round((n||0)*10)/10)+'%';}
function dshort(ds){var d=new Date(ds+'T12:00:00');return d.getDate()+' '+AYLAR[d.getMonth()].slice(0,3);}
function esc(s){return (s==null?'':''+s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function dlong(ds){var d=new Date(ds+'T12:00:00');return d.getDate()+' '+AYLAR[d.getMonth()];}
function dfull(ds){var d=new Date(ds+'T12:00:00');return d.getDate()+' '+AYLAR[d.getMonth()]+' '+d.getFullYear();}
function num2(n){return (Math.round((+n||0)*100)/100).toFixed(2).replace('.',',');}
function signTl(n){return (n>0?'+':'')+tl(n);}
function signUsd(n){return (n>0?'+':'')+usd(n);}
function toast(msg){
  var el=document.getElementById('toast'); if(!el)return;
  el.textContent=msg; el.classList.add('on');
  clearTimeout(toast.t); toast.t=setTimeout(function(){el.classList.remove('on');},3200);
}

/* ---------- kartlar ve hesaplar ---------- */
function accById(id){ for(var i=0;i<S.accounts.length;i++) if(S.accounts[i].id===id) return S.accounts[i]; return null; }
function accName(id){ if(!id) return 'Belirtilmedi'; var a=accById(id); return a?a.n:'Kaldırılmış hesap'; }
function accUse(id){
  return S.expenses.filter(function(e){return e.acc===id;}).length+S.invests.filter(function(i){return i.acc===id;}).length;
}
function accOptions(sel){
  var h='<option value="">Belirtilmedi</option>';
  [['kart','Kredi kartları'],['hesap','Hesaplar']].forEach(function(g){
    var list=S.accounts.filter(function(a){return a.t===g[0] && (!a.off || a.id===sel);});
    if(!list.length) return;
    h+='<optgroup label="'+g[1]+'">'+list.map(function(a){
      return '<option value="'+a.id+'"'+(a.id===sel?' selected':'')+'>'+esc(a.n)+(a.off?' (kaldırıldı)':'')+'</option>';
    }).join('')+'</optgroup>';
  });
  if(sel && !accById(sel)) h+='<option value="'+esc(sel)+'" selected>Kaldırılmış hesap</option>';
  return h;
}
/* ---------- toplamlar ---------- */
function expensesOf(pid){return S.expenses.filter(function(e){return periodIdOf(e.date)===pid;});}
function spentByCat(pid){
  var m={};
  expensesOf(pid).forEach(function(e){m[e.cat]=(m[e.cat]||0)+(+e.amount||0);});
  return m;
}
function investsOf(pid,bucket){
  return S.invests.filter(function(i){
    return periodIdOf(i.date)===pid && (!bucket || i.bucket===bucket);
  });
}
function netTl(i){ var g=(+i.price||0)*(+i.qty||0); var f=+i.fees||0; return i.type==='sat' ? -(g-f) : (g+f); }
function investedByCat(pid,bucket){
  var m={};
  investsOf(pid,bucket).forEach(function(i){ m[i.cat]=(m[i.cat]||0)+netTl(i); });
  return m;
}
/* Fon hedefi: kategoriye bağlı fonda hedef, kategorinin limitinden o dönemde
   yapılan harcama düşülerek bulunur. Harcamadan artan fonu ise fonu olan
   kategorilerin kalanını saymaz, iki kez birikmesin diye. */
function fundTargets(pid){
  var n=planNums(pid), spent=spentByCat(pid), out={}, fonKalan=0, toplam=0;
  Object.keys(spent).forEach(function(k){ toplam+=spent[k]; });
  S.funds.forEach(function(f){
    if(f.src==='artan') return;
    var pc=n.p.ec.filter(function(x){return x.id===f.src;})[0];
    var lim=pc?n.hb*pc.p/100:0, kul=spent[f.src]||0;
    var hedef=Math.max(0,lim-kul);
    out[f.id]={hedef:hedef,limit:lim,harcanan:kul,cat:f.src};
    fonKalan+=hedef;
  });
  S.funds.forEach(function(f){
    if(f.src!=='artan') return;
    out[f.id]={hedef:Math.max(0,(n.hb-toplam)-fonKalan),limit:n.hb,harcanan:toplam,cat:'artan'};
  });
  return out;
}

/* ---------- çizgi grafik ---------- */
function lineChart(series,fmt){
  var W=320,H=150,PL=6,PR=6,PT=10,PB=18;
  var all=[];series.forEach(function(s){all=all.concat(s.pts);});
  if(all.length<2) return '<div class="empty">Grafik için en az iki kayıt gerekiyor.</div>';
  var xs=all.map(function(p){return p.x;}), ys=all.map(function(p){return p.y;});
  var x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs);
  var y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
  if(y0>0)y0=0; if(y1===y0)y1=y0+1; if(x1===x0)x1=x0+1;
  function px(x){return PL+(x-x0)/(x1-x0)*(W-PL-PR);}
  function py(y){return PT+(1-(y-y0)/(y1-y0))*(H-PT-PB);}
  var s='<svg class="mini" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img">';
  s+='<line x1="'+PL+'" y1="'+py(y0)+'" x2="'+(W-PR)+'" y2="'+py(y0)+'" stroke="#DCDED7" stroke-width="1"/>';
  series.forEach(function(se){
    var d=se.pts.map(function(p,i){return (i?'L':'M')+px(p.x).toFixed(1)+' '+py(p.y).toFixed(1);}).join(' ');
    s+='<path d="'+d+'" fill="none" stroke="'+se.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
    var last=se.pts[se.pts.length-1];
    s+='<circle cx="'+px(last.x).toFixed(1)+'" cy="'+py(last.y).toFixed(1)+'" r="2.5" fill="'+se.color+'"/>';
  });
  s+='<text x="'+PL+'" y="'+(H-5)+'" font-size="9" fill="#7C8A84">'+dshort(new Date(x0).toISOString().slice(0,10))+'</text>';
  s+='<text x="'+(W-PR)+'" y="'+(H-5)+'" font-size="9" fill="#7C8A84" text-anchor="end">'+dshort(new Date(x1).toISOString().slice(0,10))+'</text>';
  s+='<text x="'+PL+'" y="'+(PT+7)+'" font-size="9" fill="#7C8A84">'+fmt(y1)+'</text>';
  s+='</svg>';
  return s;
}
function cumSeries(list,valFn){
  var srt=list.slice().sort(function(a,b){return a.date<b.date?-1:1;});
  var t=0,pts=[];
  srt.forEach(function(i){ t+=valFn(i); pts.push({x:new Date(i.date+'T12:00:00').getTime(),y:t}); });
  return pts;
}

function viewPlan(){

  var toplamYatirim=sum(Object.keys(invA),function(k){return invA[k];});
  var ecSum=sum(p.ec,function(c){return +c.p;}), scSum=sum(p.sc,function(c){return +c.p;});

  if(!p.approved){
    h+='<div class="card status"><h2>'+lbl+' planı taslak</h2>';
    h+='<p class="sub">Gelir, sabit gider ve oranları kontrol edin. Onayladığınızda dönem başlar ve uygulama bu dönemle açılır.</p>';
    h+='<button class="wide" onclick="approvePlan()">Planı onayla ve dönemi başlat</button></div>';
  }

  h+='<div class="between"><div><p class="lbl">Harcama ve birikim bütçesi</p><p class="big">'+tl(n.kalan)+'</p></div>';
  h+='<div style="text-align:right"><p class="lbl">Gelir '+tl(n.gelir)+'</p><p class="lbl">Sabit gider '+tl(n.sabit)+'</p></div></div>';
  h+='<hr class="sep">';
  h+='<div class="grid2">';
  h+='<div><p class="lbl">Harcama %'+p.splitH+'</p><p class="mid">'+tl(n.hb)+'</p>'+barHtml(toplamHarcama,n.hb)+'<p class="lbl" style="margin-top:4px">Harcanan '+tl(toplamHarcama)+'</p></div>';
  h+='<div><p class="lbl">Birikim %'+(100-p.splitH)+'</p><p class="mid gold">'+tl(n.bb)+'</p>'+barHtml(toplamYatirim,n.bb)+'<p class="lbl" style="margin-top:4px">Yatırılan '+tl(toplamYatirim)+'</p></div>';
  h+='</div>';
  h+='<div class="row" style="margin-top:12px;gap:8px"><button class="ghost slim grow" onclick="editGelir()">Gelir ve sabit gider</button>';
  h+='<button class="ghost slim grow" onclick="editSplit()">Dağılımı değiştir</button></div>';
  h+='</div>';

  if(Math.round(ecSum)!==100) h+='<div class="warnbar">Harcama kategorilerinin toplamı %'+nf2.format(ecSum)+'. Toplamı 100 yapmadan bütçe doğru dağılmaz.</div>';
  h+='<div class="card"><div class="between"><h2>Harcama kategorileri</h2><button class="ghost slim" onclick="editCats(\'ec\')">Oranları düzenle</button></div>';
  h+='<p class="sub">Her kategoride planlanan limitin ne kadarını kullandığınız harcama girdikçe güncellenir.</p>';
  var ecs=p.ec.slice().sort(function(a,b){return b.p-a.p;});
  ecs.forEach(function(c){
    var meta=catById(c.id); if(!meta)return;
    var lim=n.hb*c.p/100, kul=spent[c.id]||0;
    h+='<div class="catrow"><div class="between"><span class="catname">'+esc(meta.n)+' <span class="tag">%'+nf2.format(c.p).replace(',00','')+'</span></span>';
    h+='<span class="catnums">'+tl(kul)+' / '+tl(lim)+'</span></div>'+barHtml(kul,lim);
    h+='<div class="between" style="margin-top:4px"><span class="lbl">'+(lim>0?pct(kul/lim*100):'—')+' kullanıldı</span>';
    h+='<span class="lbl '+(lim-kul<0?'neg':'')+'">Kalan '+tl(lim-kul)+'</span></div></div>';
  });
  h+='</div>';

  if(Math.round(scSum)!==100) h+='<div class="warnbar">Birikim kategorilerinin toplamı %'+nf2.format(scSum)+'.</div>';
  h+='<div class="card"><div class="between"><h2>Birikim kategorileri</h2><button class="ghost slim" onclick="editCats(\'sc\')">Oranları düzenle</button></div>';
  var scs=p.sc.slice().sort(function(a,b){return b.p-a.p;});
  scs.forEach(function(c){
    var meta=savById(c.id); if(!meta)return;
    var lim=n.bb*c.p/100, kul=invA[c.id]||0, subs=planSubs(p,meta.id);
    h+='<div class="catrow"><div class="between"><span class="catname">'+esc(meta.n)+' <span class="tag y">%'+nf2.format(c.p).replace(',00','')+'</span></span>';
    h+='<span class="catnums">'+tl(kul)+' / '+tl(lim)+'</span></div>'+barHtml(kul,lim,true);

      var st=sum(subs,function(s){return +s.p;});
      h+='<p class="lbl" style="margin-top:4px">'+subs.map(function(s){return esc(s.n)+' '+tl(lim*s.p/100);}).join(' · ')+'</p>';
      h+='<div class="between" style="margin-top:3px"><span class="lbl'+(Math.abs(st-100)>0.05?' neg':'')+'">Alt kalem toplamı %'+nf2.format(st).replace(',00','')+
         (Math.abs(st-100)>0.05?' · '+tl(lim*st/100)+' dağıtılıyor, limit '+tl(lim):'')+'</span>'+
         '<button class="ghost slim" onclick="editSubs(\''+meta.id+'\')">Alt oranlar</button></div>';

      h+='<div class="between" style="margin-top:3px"><span class="lbl">Alt kalem yok</span>'+
         '<button class="ghost slim" onclick="editSubs(\''+meta.id+'\')">Alt oranlar</button></div>';
    }

  h+='<div class="card"><h2>Fon hedefleri</h2>';
  h+='<p class="sub">Kategorinin limitinden o dönemde yapılan harcama düşülür, kalanı fona ayrılır. Harcamadan artan, fonu olmayan kategorilerde kalan tutardır.</p>';
  var ft=fundTargets(pid);
  S.funds.forEach(function(f){
    var t=ft[f.id]||{hedef:0,limit:0,harcanan:0};
    var yat=0; investsOf(pid,'fon').forEach(function(i){ if(i.cat===f.id) yat+=netTl(i); });
    h+='<div class="catrow"><div class="between"><span class="catname">'+esc(f.n)+' <span class="tag">'+esc(f.v)+'</span></span>';
    h+='<span class="catnums">'+tl(yat)+' / '+tl(t.hedef)+'</span></div>'+barHtml(yat,t.hedef,true);
    h+='<p class="lbl" style="margin-top:4px">Limit '+tl(t.limit)+' · harcanan '+tl(t.harcanan)+'</p></div>';
  });
  h+='</div>';

  var np=shiftPeriod(pid,1), npl=S.plans[np], nl=periodInfo(np).label;
  h+='<div class="card"><h2>Sonraki dönem</h2>';
  if(!npl){
    h+='<p class="sub">'+nl+' planını bu dönemin gelir, gider ve oranlarıyla taslak olarak açar. Siz onaylayana kadar dönem başlamaz.</p>';
    h+='<button class="wide ghost" onclick="nextPeriod()">'+nl+' planını hazırla</button></div>';
  } else if(!npl.approved){
    h+='<p class="sub">'+nl+' taslağı hazır, henüz onaylanmadı.</p>';
    h+='<button class="wide ghost" onclick="goPlan(\''+np+'\')">'+nl+' taslağını aç</button></div>';
  } else {
    h+='<p class="sub">'+nl+' planı onaylı.</p>';
    h+='<button class="wide ghost" onclick="goPlan(\''+np+'\')">'+nl+' dönemine git</button></div>';
  }
  return h;
}
function barHtml(used,limit,gold){
  var r = limit>0 ? used/limit : 0;
  var w = Math.max(0,Math.min(1,r))*100;
  var cls = gold ? (r>=1?'':'warn') : (r>1?'over':(r>0.85?'warn':''));
  if(gold && r>=1) cls='';
  return '<div class="bar"><i class="'+cls+'" style="width:'+w.toFixed(1)+'%"></i></div>';
}
function nextPeriod(){ goPlan(shiftPeriod(curPid(),1)); }
/* Onaydan önce planın tutarlı olup olmadığını denetler. */
function planProblems(pid){
  var n=planNums(pid), p=n.p, out=[];
  if(n.kalan<=0) out.push('Gelir girilmemiş ya da sabit giderler geliri aşıyor.');
  var ec=sum(p.ec,function(c){return +c.p;}), sc=sum(p.sc,function(c){return +c.p;});
  if(Math.abs(ec-100)>0.05) out.push('Harcama oranlarının toplamı %'+nf2.format(ec)+'. 100 olmalı.');
  if(Math.abs(sc-100)>0.05) out.push('Birikim oranlarının toplamı %'+nf2.format(sc)+'. 100 olmalı.');
  p.sc.forEach(function(c){
    var m=savById(c.id), subs=planSubs(p,c.id); if(!m||!subs.length) return;
    var st=sum(subs,function(s){return +s.p;});
    if(Math.abs(st-100)>0.05) out.push(m.n+' alt oranlarının toplamı %'+nf2.format(st)+'. 100 olmalı.');
  });
  return out;
}
function approvePlan(){
  var pid=curPid(), lbl=periodInfo(pid).label, probs=planProblems(pid);
  if(probs.length){ alert('Plan onaylanamadı.\n\n'+probs.join('\n')); return; }
  if(!confirm(lbl+' planı onaylansın mı? Dönem başlar ve uygulama bu dönemle açılır.')) return;
  var p=getPlan(pid,true); p.approved=true; p.approvedAt=today();
  S.curPeriod=pid; save(); render(); toast(lbl+' dönemi başladı.');
}

  save(); closeSheet(); render();
}

function editSubs(catId){
  var m=savById(catId); if(!m)return;
  var n=planNums(curPid()), pc=n.p.sc.filter(function(x){return x.id===catId;})[0];
  var lim=pc?n.bb*pc.p/100:0;
  var h='<h2>'+esc(m.n)+' alt oranları</h2>';
  h+='<p class="sub">Toplam 100 olmalı. Bu dönemde '+esc(m.n)+' için ayrılan tutar '+tl(lim)+'. Değişiklik bu dönemden itibaren geçerli olur. Geçmiş dönemler değişmez.</p>';
  h+='<div id="sbList">';
  planSubs(n.p,catId).forEach(function(s){ h+=subRow(s.n,s.p); });
  h+='</div>';
  h+='<div class="row" style="margin-top:6px"><button class="ghost slim" onclick="addSubRow()">Alt kalem ekle</button>'+
     '<button class="ghost slim" onclick="spreadSubs()">Eşit dağıt</button></div>';
  h+='<p class="lbl" id="sbTot" style="margin-top:10px"></p>';
  h+='<div class="row" style="margin-top:12px"><button class="ghost grow" onclick="closeSheet()">Vazgeç</button>'+
     '<button class="grow" onclick="saveSubs(\''+catId+'\')">Kaydet</button></div>';

function subRow(nm,p){
  return '<div class="row sbrow" style="margin-bottom:7px">'+
    '<input type="text" class="grow" data-f="n" value="'+esc(nm||'')+'" placeholder="Alt kalem">'+
    '<input type="number" inputmode="decimal" class="pctin" data-f="p" value="'+(p===undefined?'':p)+'">'+
    '<button class="ghost slim" onclick="this.parentNode.remove();sbTotal()">×</button></div>';
}
var sbLim=0;
function sbWatch(lim){
  sbLim=lim;
  var box=document.getElementById('sbList');
  if(box) box.addEventListener('input',sbTotal);
  sbTotal();
}
function sbTotal(){
  var box=document.getElementById('sbList'), out=document.getElementById('sbTot');
  if(!box||!out)return;
  var t=0;
  box.querySelectorAll('[data-f=p]').forEach(function(i){ t+=parseFloat(i.value)||0; });
  var fark=Math.abs(t-100)>0.05;
  out.className='lbl'+(fark?' neg':' pos');
  out.textContent='Toplam %'+nf2.format(t)+' · dağıtılan '+tl(sbLim*t/100)+(fark?' (limit '+tl(sbLim)+')':'');
}
function addSubRow(){
  var d=document.createElement('div');
  d.innerHTML=subRow('','');
  document.getElementById('sbList').appendChild(d.firstChild);
  sbTotal();
}
function spreadSubs(){
  var rows=document.getElementById('sbList').querySelectorAll('.sbrow');
  if(!rows.length)return;
  var pay=Math.round(100/rows.length*10)/10;
  rows.forEach(function(r,i){
    r.querySelector('[data-f=p]').value = i===rows.length-1
      ? Math.round((100-pay*(rows.length-1))*10)/10 : pay;
  });
  sbTotal();
}
function saveSubs(catId){
  var m=savById(catId); if(!m)return;
  var out=[];
  document.getElementById('sbList').querySelectorAll('.sbrow').forEach(function(r){
    var nm=r.querySelector('[data-f=n]').value.trim();
    if(!nm)return;
    out.push({n:nm,p:parseFloat(r.querySelector('[data-f=p]').value)||0});
  });
  var cp=curPid(); getPlan(cp,true);
  Object.keys(S.plans).forEach(function(k){
    if(k<cp) return;
    var pl=S.plans[k]; if(!pl.subs) pl.subs={};
    pl.subs[catId]=clone(out);
  });
  m.subs=clone(out);
  save(); closeSheet(); render();
}
function editCats(kind){

  var list=p[kind], metaFn=kind==='ec'?catById:savById;
  var h='<h2>'+(kind==='ec'?'Harcama':'Birikim')+' oranları</h2><p class="sub">Toplam 100 olmalı. Değişiklik yalnızca '+periodInfo(curPid()).label+' dönemini etkiler.</p><div id="pctList">';
  list.forEach(function(c){
    var m=metaFn(c.id); if(!m)return;
    h+='<div class="between" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="catname">'+esc(m.n)+'</span>'+
       '<input class="pctin" type="number" inputmode="decimal" data-id="'+c.id+'" value="'+c.p+'"></div>';

function saveCats(kind){
  var p=getPlan(curPid(),true);

    h+='<label class="f"><span>Kart / hesap</span><select id="exAcc">'+accOptions(S.lastAcc.h)+'</select></label>';
    h+='<label class="f"><span>Not</span><input type="text" id="exNote" placeholder="İsteğe bağlı"></label>';

    p.ec.slice().sort(function(a,b){return (spent[b.id]||0)-(spent[a.id]||0);}).forEach(function(c){

      var lim=n.hb*c.p/100, kul=spent[c.id]||0;

      h+='<div class="catrow"><div class="between"><span class="catname">'+esc(m.n)+'</span><span class="catnums">'+tl(kul)+' / '+tl(lim)+'</span></div>'+barHtml(kul,lim)+'</div>';

  if(subTab.harcama==='liste'){

    var list=all.filter(function(e){
      return (lf.acc==='*' || (e.acc||'')===lf.acc) && (lf.cat==='*' || e.cat===lf.cat);
    }).sort(function(a,b){return a.date<b.date?1:-1;});

    h+='<label class="f" style="margin:0"><span>Kart / hesap</span><select onchange="setLf(\'acc\',this.value)">'+filterAccOptions(all,lf.acc)+'</select></label>';
    h+='<label class="f" style="margin:0"><span>Kategori</span><select onchange="setLf(\'cat\',this.value)">'+filterCatOptions(all,lf.cat)+'</select></label>';
    h+='</div></div>';
    h+='<div class="card"><div class="between"><h2>'+periodInfo(pid).label+' kayıtları</h2><span class="tag">'+list.length+' kayıt</span></div>';
    if(!list.length) h+='<div class="empty">'+(filtreli?'Bu filtreye uyan kayıt yok.':'Kayıt yok.')+'</div>';
    list.forEach(function(e){
      var m=catById(e.cat), ia=e.amount<0;
      var alt=[e.sub, e.acc?accName(e.acc):'', e.note].filter(Boolean).join(' · ');
      h+='<div class="item"><div class="d">'+dshort(e.date)+'</div><div class="t"><b>'+esc(m?m.n:e.cat)+(ia?' <span class="tag g">iade</span>':'')+'</b>'+
         '<small>'+esc(alt||'—')+'</small></div>'+
         '<div class="a'+(ia?' pos':'')+'">'+tl(e.amount)+'<br><button class="ghost slim" style="margin-top:4px" onclick="editExpense(\''+e.id+'\')">Düzenle</button></div></div>';
    });
    h+='<hr class="sep"><div class="between"><span class="lbl">'+(filtreli?'Filtrelenen toplam':'Dönem toplamı')+'</span><span class="mid">'+tl(sum(list,function(x){return +x.amount;}))+'</span></div></div>';
  }

  if(subTab.harcama==='rapor'){
    h+=expenseReport();
  }
  return h;

var lf={acc:'*',cat:'*'};
function setLf(k,v){ lf[k]=v; render(); }
function filterAccOptions(list,sel){
  var used={}; list.forEach(function(e){ used[e.acc||'']=1; });
  var h='<option value="*">Tümü</option><option value=""'+(sel===''?' selected':'')+'>Belirtilmedi</option>';
  S.accounts.forEach(function(a){
    if(a.off && !used[a.id]) return;
    h+='<option value="'+a.id+'"'+(a.id===sel?' selected':'')+'>'+esc(a.n)+'</option>';
  });
  Object.keys(used).forEach(function(k){ if(k && !accById(k)) h+='<option value="'+esc(k)+'"'+(k===sel?' selected':'')+'>Kaldırılmış hesap</option>'; });
  return h;
}
function filterCatOptions(list,sel){
  var used={}; list.forEach(function(e){ used[e.cat]=1; });
  var h='<option value="*">Tümü</option>';
  S.expenseCats.forEach(function(c){ h+='<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+esc(c.n)+'</option>'; });
  Object.keys(used).forEach(function(k){ if(!catById(k)) h+='<option value="'+esc(k)+'"'+(k===sel?' selected':'')+'>Silinmiş kategori</option>'; });
  return h;
}
function setSub(tab,val){ subTab[tab]=val; render(); }
function fillSub(){
  var id=document.getElementById('exCat').value, m=catById(id);
  var sel=document.getElementById('exSub');
  var subs=(m&&m.subs)||[];
  document.getElementById('exSubWrap').style.display=subs.length?'block':'none';

function exTypeChange(){

}
function addExpense(){
  var a=Math.abs(parseFloat(document.getElementById('exAmt').value));

  var subEl=document.getElementById('exSub');
  var t=document.getElementById('exType').value;
  var acc=document.getElementById('exAcc').value;
  var d=document.getElementById('exDate').value||today();
  S.expenses.push({
    id:'e'+Date.now()+Math.random().toString(36).slice(2,6),
    date:d,
    cat:document.getElementById('exCat').value,
    sub:subEl?subEl.value:'',
    amount:t==='iade'?-a:a,
    acc:acc,
    note:document.getElementById('exNote').value.trim()
  });
  S.lastAcc.h=acc;
  save(); render(); savedNote(d, t==='iade'?'İade':'Harcama');
}
function editExpense(id){
  var e=S.expenses.filter(function(x){return x.id===id;})[0]; if(!e)return;
  var p=getPlan(curPid(),true);
  var catOpts=p.ec.map(function(c){var m=catById(c.id);return m?'<option value="'+c.id+'"'+(c.id===e.cat?' selected':'')+'>'+esc(m.n)+'</option>':'';}).join('');
  if(!p.ec.some(function(c){return c.id===e.cat && catById(c.id);})) catOpts+='<option value="'+esc(e.cat)+'" selected>'+esc(catById(e.cat)?catById(e.cat).n:'Silinmiş kategori')+'</option>';
  var h='<h2>Harcamayı düzenle</h2>';
  h+='<label class="f"><span>Tarih</span><input type="date" id="edDate" value="'+e.date+'"></label>';
  h+='<label class="f"><span>Kategori</span><select id="edCat">'+catOpts+'</select></label>';
  h+='<label class="f"><span>Alt kalem</span><input type="text" id="edSub" value="'+esc(e.sub)+'"></label>';
  h+='<div class="grid2"><label class="f"><span>Kayıt türü</span><select id="edType">'+
     '<option value="harcama"'+(e.amount>=0?' selected':'')+'>Harcama</option>'+
     '<option value="iade"'+(e.amount<0?' selected':'')+'>İade / geri ödeme</option></select></label>';
  h+='<label class="f"><span>Tutar (₺)</span><input type="number" inputmode="decimal" id="edAmt" value="'+Math.abs(e.amount)+'"></label></div>';
  h+='<label class="f"><span>Kart / hesap</span><select id="edAcc">'+accOptions(e.acc||'')+'</select></label>';

     '<button class="ghost grow" onclick="closeSheet()">Vazgeç</button><button class="grow" onclick="saveExpense(\''+id+'\')">Kaydet</button></div>';
  openSheet(h);
}
function saveExpense(id){
  var e=S.expenses.filter(function(x){return x.id===id;})[0]; if(!e)return;
  e.date=document.getElementById('edDate').value||e.date;
  e.cat=document.getElementById('edCat').value;
  e.sub=document.getElementById('edSub').value.trim();
  var ea=Math.abs(parseFloat(document.getElementById('edAmt').value)||0);
  e.amount=document.getElementById('edType').value==='iade'?-ea:ea;
  e.acc=document.getElementById('edAcc').value;
  e.note=document.getElementById('edNote').value.trim();
  save(); closeSheet(); render();
}
function delExpense(id){
  if(!confirm('Bu harcama kaydı silinsin mi?'))return;
  S.expenses=S.expenses.filter(function(x){return x.id!==id;});
  save(); closeSheet(); render();
}
function expenseReport(){
  var R=rangeOf('h');
  var list=S.expenses.filter(function(e){return inRange(e.date,R);});
  var h=rangeSel('h',R);
  h+=expSummary(list,R)+expCatCard(list,R)+accountCard(R);
  if(!R.ozel && R.pids.length>1) h+=periodCompare(R);
  h+=catHistCard();
  h+=budgetScorecard()+catScorecard()+yearScorecard();
  return h;
}
function rangeLimits(R){
  var o={hb:0,bb:0,planli:0,eksik:0,ec:{},sc:{}};
  if(R.ozel) return o;
  R.pids.forEach(function(k){
    var nn=planNumsRO(k);
    if(!nn){ o.eksik++; return; }
    o.planli++; o.hb+=nn.hb; o.bb+=nn.bb;
    nn.p.ec.forEach(function(c){ o.ec[c.id]=(o.ec[c.id]||0)+nn.hb*c.p/100; });
    nn.p.sc.forEach(function(c){ o.sc[c.id]=(o.sc[c.id]||0)+nn.bb*c.p/100; });
  });
  return o;
}
function expSummary(list,R){
  var tot=sum(list,function(e){return +e.amount;});
  var iade=sum(list.filter(function(e){return e.amount<0;}),function(e){return -e.amount;});
  var L=rangeLimits(R);
  var h='<div class="card"><h2>Özet</h2><div class="stat2">';
  h+='<div><p class="lbl">Harcama</p><p class="mid">'+tl(tot)+'</p></div>';
  if(!R.ozel){
    h+='<div><p class="lbl">Bütçe</p><p class="mid">'+tl(L.hb)+'</p></div>';
    h+='<div><p class="lbl">Fark</p><p class="mid '+(tot-L.hb>0?'neg':'pos')+'">'+signTl(tot-L.hb)+'</p></div>';
    h+='<div><p class="lbl">Dönem başına</p><p class="mid">'+tl(tot/Math.max(1,R.pids.length))+'</p></div>';
  }
  h+='<div><p class="lbl">Kayıt</p><p class="mid">'+list.length+'</p></div>';
  h+='<div><p class="lbl">İade</p><p class="mid pos">'+tl(iade)+'</p></div>';
  h+='</div>';
  if(!R.ozel) h+=barHtml(tot,L.hb);
  if(L.eksik) h+='<p class="lbl" style="margin-top:6px">'+L.eksik+' dönemin planı yok, bütçe toplamına girmedi.</p>';
  if(R.ozel) h+='<p class="lbl" style="margin-top:6px">Tarih aralığında dönemler bölünebildiği için bütçe karşılaştırması yapılmaz.</p>';
  if(!R.ozel && R.pids.indexOf(periodIdOf(today()))>=0) h+='<p class="lbl" style="margin-top:6px">Süren dönemin bütçesi tam sayılıyor, harcaması henüz tamamlanmadı.</p>';
  h+='</div>';
  return h;
}
function expCatCard(list,R){
  var by={}, subBy={}, L=rangeLimits(R);
  list.forEach(function(e){
    by[e.cat]=(by[e.cat]||0)+(+e.amount||0);
    var s=e.sub||'Alt kalemsiz';
    if(!subBy[e.cat]) subBy[e.cat]={};
    subBy[e.cat][s]=(subBy[e.cat][s]||0)+(+e.amount||0);
  });
  var tot=0; Object.keys(by).forEach(function(k){tot+=by[k];});
  var ids={}; Object.keys(by).forEach(function(k){ids[k]=1;}); Object.keys(L.ec).forEach(function(k){ if(L.ec[k]>0) ids[k]=1; });
  var bos=Object.keys(ids).filter(function(k){return !by[k];});
  var keys=Object.keys(ids).filter(function(k){return !!by[k];}).sort(function(a,b){return (by[b]||0)-(by[a]||0);});
  var h='<div class="card"><h2>Kategori dağılımı</h2><p class="sub">Aralıktaki harcamanın kategorilere dağılımı'+(R.ozel?'.':' ve aralık boyunca planlanan limitler.')+'</p>';
  if(!keys.length) return h+'<div class="empty">Bu aralıkta harcama yok.</div></div>';
  keys.forEach(function(k){
    var sp=by[k]||0, lim=L.ec[k]||0, m=catById(k);
    h+='<div class="catrow"><div class="between"><span class="catname">'+esc(m?m.n:'Silinmiş kategori')+'</span>'+
       '<span class="catnums">'+tl(sp)+(R.ozel?'':' / '+tl(lim))+'</span></div>';
    h+=R.ozel? barHtml(sp,tot,true) : barHtml(sp,lim);
    h+='<div class="between" style="margin-top:4px"><span class="lbl">Toplamın '+(tot?pct(sp/tot*100):'—')+'</span>'+
       (R.ozel?'':'<span class="lbl'+(sp>lim?' neg':'')+'">'+(lim>0?pct(sp/lim*100)+' kullanıldı':'Limit yok')+'</span>')+'</div>';
    var sb=subBy[k]||{}, sk=Object.keys(sb).sort(function(a,b){return sb[b]-sb[a];});
    if(sk.length>1 || (sk.length===1 && sk[0]!=='Alt kalemsiz')){
      h+='<p class="lbl" style="margin-top:3px">'+sk.map(function(s){return esc(s)+' '+tl(sb[s]);}).join(' · ')+'</p>';
    }
    h+='</div>';
  });
  if(bos.length) h+='<p class="lbl" style="margin-top:8px">Harcama olmayan kategoriler '+bos.map(function(k){var m=catById(k);return esc(m?m.n:k);}).join(', ')+'</p>';
  h+='</div>';
  return h;
}
function periodCompare(R){
  var h='<div class="card"><h2>Dönem karşılaştırması</h2><p class="sub">Aralıktaki dönemlerin toplam harcaması ve bütçesi.</p>';
  var pts=R.pids.map(function(k){
    var t=sum(expensesOf(k),function(e){return +e.amount;});
    return {x:new Date(periodInfo(k).end+'T12:00:00').getTime(),y:t};
  });
  var bud=[]; R.pids.forEach(function(k){ var nn=planNumsRO(k); if(nn) bud.push({x:new Date(periodInfo(k).end+'T12:00:00').getTime(),y:nn.hb}); });
  h+=lineChart([{color:'#A23A30',pts:pts}].concat(bud.length>1?[{color:'#9AA8A2',pts:bud}]:[]),tl);
  h+='<div class="legend"><span><s style="background:#A23A30"></s>Harcama</span>'+(bud.length>1?'<span><s style="background:#9AA8A2"></s>Bütçe</span>':'')+'</div>';
  R.pids.slice().reverse().forEach(function(k){
    var t=sum(expensesOf(k),function(e){return +e.amount;}), nn=planNumsRO(k);
    h+='<div class="catrow"><div class="between"><span class="catname">'+periodInfo(k).label+'</span><span class="catnums">'+tl(t)+' / '+(nn?tl(nn.hb):'plan yok')+'</span></div>'+barHtml(t,nn?nn.hb:0)+'</div>';
  });
  h+='</div>';
  return h;
}
var repCatSel='';
function catHistCard(){
  if(!repCatSel || !catById(repCatSel)) repCatSel=(S.expenseCats[0]||{}).id||'';
  var h='<div class="card"><h2>Kategori geçmişi</h2><p class="sub">Bir kategoriyi seçin, aralıktaki dönemler arası değişimi ve alt kalemlerini görün.</p>';
  h+='<label class="f"><select id="repCat" onchange="repCatSel=this.value;drawCatHist()">'+

/* --- portföy --- */
/* Ortalama maliyet yöntemi. Alışta maliyet eklenir. Satışta satılan miktarın
   ortalama maliyeti düşülür, satış geliri ile bu maliyet arasındaki fark
   gerçekleşen kâr olarak ayrı tutulur. Dolar maliyeti her işlemin kendi kuruyla
   hesaplanır. bucket boşsa iki bölüm birlikte, upto verilirse o tarihe kadar. */
function holdings(bucket,upto){
  var m={};
  S.invests.map(function(i,ix){return {i:i,ix:ix};})
    .filter(function(o){ return (!bucket||o.i.bucket===bucket) && (!upto||o.i.date<=upto); })
    .sort(function(a,b){ return a.i.date<b.i.date?-1:(a.i.date>b.i.date?1:a.ix-b.ix); })
    .forEach(function(o){
      var i=o.i, k=i.cat+(i.sub?'|'+i.sub:'');
      if(!m[k]) m[k]={key:k,cat:i.cat,sub:i.sub||'',bucket:i.bucket,qty:0,cost:0,costUsd:0,real:0,realUsd:0,count:0};
      var r=m[k], q=+i.qty||0, g=(+i.price||0)*q, f=+i.fees||0, u=+i.usd||0;
      r.count++;
      if(i.type==='sat'){
        var oran=r.qty>0?Math.min(1,q/r.qty):0;
        var cOut=r.cost*oran, uOut=r.costUsd*oran, gelir=g-f;
        r.real+=gelir-cOut; r.realUsd+=(u?gelir/u:0)-uOut;
        r.cost-=cOut; r.costUsd-=uOut; r.qty-=q;
      } else {
        r.qty+=q; r.cost+=g+f; r.costUsd+=u?(g+f)/u:0;
      }
      if(Math.abs(r.qty)<1e-9){ r.qty=0; r.cost=0; r.costUsd=0; }
    });
  return m;
}
function holdVal(r){
  var pr=S.prices[r.key], o={pr:pr||null,val:null,valUsd:null,fark:null,farkUsd:null};
  if(pr && r.qty>0){
    o.val=pr.price*r.qty; o.fark=o.val-r.cost;
    if(S.lastUsd>0){ o.valUsd=o.val/S.lastUsd; o.farkUsd=o.valUsd-r.costUsd; }
  }
  return o;
}
function holdName(r){
  var c=savById(r.cat)||fundById(r.cat);
  return (c?c.n:r.cat)+(r.sub?' · '+r.sub:'');
}
function holdUnit(r){ var c=savById(r.cat)||fundById(r.cat); return (c&&c.unit)||''; }
function holdTotals(m){
  var t={cost:0,costUsd:0,real:0,realUsd:0,pc:0,pcUsd:0,val:0,valUsd:0,priced:0,missing:0};
  Object.keys(m).forEach(function(k){
    var r=m[k], v=holdVal(r);
    t.real+=r.real; t.realUsd+=r.realUsd;
    if(r.qty<=0) return;
    t.cost+=r.cost; t.costUsd+=r.costUsd;
    if(v.val===null){ t.missing++; return; }
    t.priced++; t.pc+=r.cost; t.pcUsd+=r.costUsd; t.val+=v.val; if(v.valUsd!==null) t.valUsd+=v.valUsd;
  });
  return t;
}
function farkHtml(f,base,fmt){
  if(f===null) return '<span class="r">—</span>';
  var p=base>0?' ('+pct(f/base*100)+')':'';
  return '<span class="r '+(f>=0?'pos':'neg')+'">'+(fmt===usd?signUsd(f):signTl(f))+p+'</span>';
}
function totalsBlock(t){
  var usdOk=S.lastUsd>0;
  var h='<div class="kv"><span class="h"></span><span class="h r">₺</span><span class="h r">$</span>';
  h+='<span>Maliyet</span><span class="r">'+tl(t.cost)+'</span><span class="r">'+usd(t.costUsd)+'</span>';
  h+='<span>Güncel değer</span><span class="r">'+(t.priced?tl(t.val):'—')+'</span><span class="r">'+(t.priced&&usdOk?usd(t.valUsd):'—')+'</span>';
  h+='<span>Fark</span>'+farkHtml(t.priced?t.val-t.pc:null,t.pc,tl)+farkHtml(t.priced&&usdOk?t.valUsd-t.pcUsd:null,t.pcUsd,usd);
  if(Math.abs(t.real)>0.005) h+='<span>Gerçekleşen kâr</span><span class="r '+(t.real>=0?'pos':'neg')+'">'+signTl(t.real)+'</span><span class="r '+(t.realUsd>=0?'pos':'neg')+'">'+signUsd(t.realUsd)+'</span>';
  h+='</div>';
  if(t.missing) h+='<p class="lbl" style="margin-top:6px">'+t.missing+' kalemin güncel fiyatı yok. Değer ve fark yalnızca fiyatı girilen kalemleri kapsar.</p>';

function usdLine(){

    : 'Dolar değeri için Güncel fiyatlar ekranına bugünkü kuru girin.';

function holdRow(r){
  var v=holdVal(r), un=holdUnit(r);
  if(r.qty<=0){
    return '<div class="catrow"><div class="between"><span class="catname">'+esc(holdName(r))+' <span class="tag">kapandı</span></span>'+
      '<span class="catnums">'+(Math.abs(r.real)>0.005?'Gerçekleşen <span class="'+(r.real>=0?'pos':'neg')+'">'+signTl(r.real)+'</span>':'')+'</span></div></div>';
  }
  var h='<div class="catrow"><div class="between"><span class="catname">'+esc(holdName(r))+'</span><span class="catnums">'+qty(r.qty)+(un?' '+esc(un):'')+'</span></div>';
  h+='<div class="kv">';
  h+='<span class="h">Ortalama maliyet</span><span class="r">'+tl2(r.cost/r.qty)+'</span><span class="r">'+usd(r.costUsd/r.qty)+'</span>';
  h+='<span class="h">Maliyet</span><span class="r">'+tl(r.cost)+'</span><span class="r">'+usd(r.costUsd)+'</span>';
  h+='<span class="h">Değer</span><span class="r">'+(v.val!==null?tl(v.val):'—')+'</span><span class="r">'+(v.valUsd!==null?usd(v.valUsd):'—')+'</span>';
  h+='<span class="h">Fark</span>'+farkHtml(v.fark,r.cost,tl)+farkHtml(v.farkUsd,r.costUsd,usd);
  if(Math.abs(r.real)>0.005) h+='<span class="h">Gerçekleşen kâr</span><span class="r '+(r.real>=0?'pos':'neg')+'">'+signTl(r.real)+'</span><span class="r '+(r.realUsd>=0?'pos':'neg')+'">'+signUsd(r.realUsd)+'</span>';
  h+='</div>';
  h+='<p class="lbl" style="margin-top:4px">'+(v.pr?'Güncel fiyat '+tl2(v.pr.price)+(v.pr.at?', '+dlong(v.pr.at):''):'Güncel fiyat girilmedi')+'</p>';
  h+='</div>';
  return h;
}
function holdingsCard(bucket,cats){
  var m=holdings(bucket), keys=Object.keys(m).sort();
  if(!keys.length) return '<div class="card"><h2>Portföy</h2><div class="empty">Henüz yatırım kaydı yok.</div></div>';
  var h='<div class="card"><div class="between"><h2>Portföy</h2><button class="ghost slim" onclick="editPrices(\''+bucket+'\')">Güncel fiyatlar</button></div>';
  h+='<p class="sub">Maliyet ortalama maliyet yöntemiyle hesaplanır. Satışta satılan miktarın maliyeti düşülür, aradaki fark gerçekleşen kâr olarak ayrı görünür. '+usdLine()+'</p>';
  h+=totalsBlock(holdTotals(m));
  var acik=keys.filter(function(k){return m[k].qty>0;}), kapali=keys.filter(function(k){return m[k].qty<=0;});
  acik.concat(kapali).forEach(function(k){ h+=holdRow(m[k]); });
  h+='</div>';
  return h;
}
function editPrices(bucket){
  var m=holdings(bucket), keys=Object.keys(m).filter(function(k){return m[k].qty>0;}).sort();
  var h='<h2>Güncel birim fiyatlar</h2><p class="sub">Portföyün bugünkü değerini görmek için kalemlerin güncel birim fiyatını ve bugünkü kuru girin. Boş bıraktığınız kalemin eski fiyatı kalır. Her kayıt değer grafiğine bir nokta ekler.</p><div id="prList">';
  keys.forEach(function(k){
    var r=m[k], pr=S.prices[k];
    h+='<label class="f"><span>'+esc(holdName(r))+' ('+qty(r.qty)+')'+(pr?' · son '+tl2(pr.price)+(pr.at?', '+dlong(pr.at):''):'')+'</span>'+
       '<input type="number" inputmode="decimal" data-k="'+esc(k)+'" value="" placeholder="Birim fiyat ₺"></label>';
  });
  if(!keys.length) h+='<div class="empty">Elde tutulan kalem yok.</div>';

function pidSpan(a,b){
  var out=[], k=a, guard=0;
  while(k<=b && guard<240){ out.push(k); k=shiftPeriod(k,1); guard++; }
  return out;
}
function rangeOf(w){
  var o=rr[w], cp=curPid(), pids, from, to, ozel=false, ks=recordPids();
  var first=ks.length?ks[0]:cp, last=ks.length?ks[ks.length-1]:cp;
  if(o.m==='ozel'){
    from=o.a||periodInfo(cp).start; to=o.b||today();
    if(to<from){ var t=from; from=to; to=t; }
    pids=pidSpan(periodIdOf(from),periodIdOf(to)); ozel=true;
  } else if(o.m==='tum'){
    pids=pidSpan(first<cp?first:cp, last>cp?last:cp);
  } else {
    var n={p1:1,p3:3,p6:6,p12:12}[o.m]||6;
    pids=pidSpan(shiftPeriod(cp,-(n-1)),cp).filter(function(k){return k>=first||k===cp;});
  }
  if(!ozel){ from=periodInfo(pids[0]).start; to=periodInfo(pids[pids.length-1]).end; }
  return {pids:pids,from:from,to:to,ozel:ozel};
}

function download(text,type,fname){
  var blob=new Blob([text],{type:type});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=fname;
  document.body.appendChild(a); a.click(); a.remove();

function csvExport(w){
  var R=rangeOf(w), rows=[], name;
  function cell(v){ v=(v==null?'':''+v); return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
  function byDate(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); }
  if(w==='h'){
    name='harcamalar';
    rows.push(['Tarih','Dönem','Kategori','Alt kalem','Tür','Tutar TL','Kart / hesap','Not']);
    S.expenses.filter(function(e){return inRange(e.date,R);}).sort(byDate).forEach(function(e){
      rows.push([e.date,periodInfo(periodIdOf(e.date)).label,(catById(e.cat)||{n:e.cat}).n,e.sub||'',e.amount<0?'İade':'Harcama',num2(e.amount),e.acc?accName(e.acc):'',e.note||'']);
    });
  } else {
    name='yatirimlar';
    rows.push(['Tarih','Dönem','Bölüm','Kategori','Alt kalem','İşlem','Birim fiyat TL','Miktar','Diğer gider TL','Net tutar TL','USD/TRY','Net tutar USD','Kart / hesap','Not']);
    S.invests.filter(function(i){return inRange(i.date,R);}).sort(byDate).forEach(function(i){
      var c=savById(i.cat)||fundById(i.cat), nt=netTl(i);
      rows.push([i.date,periodInfo(periodIdOf(i.date)).label,i.bucket==='fon'?'Harcama fonu':'Hedeflenen',c?c.n:i.cat,i.sub||'',i.type==='sat'?'Satış':'Alış',
        num2(i.price),(''+(+i.qty||0)).replace('.',','),num2(i.fees),num2(nt),num2(i.usd),num2(i.usd?nt/i.usd:0),i.acc?accName(i.acc):'',i.note||'']);
    });
  }
  if(rows.length<2){ alert('Bu aralıkta kayıt yok.'); return; }
  download('\uFEFF'+rows.map(function(r){return r.map(cell).join(';');}).join('\r\n'),'text/csv;charset=utf-8','butce-'+name+'-'+R.from+'-'+R.to+'.csv');
}

function scoredPids(){
  var set={};
  S.expenses.forEach(function(e){ set[periodIdOf(e.date)]=1; });
  return Object.keys(set).sort();

function periodScore(pid){
  var n=planNums(pid), spent=spentByCat(pid);
  var inside=0, over=0, names=[], spT=0, bilinmeyen=0, bnAd=[], known={};
  n.p.ec.forEach(function(c){
    var m=catById(c.id); if(!m) return;
    known[c.id]=1;
    var lim=n.hb*c.p/100, kul=spent[c.id]||0;
    if(lim<=0 && kul<=0) return;
    if(kul>lim){ over++; names.push(m.n); } else inside++;
  });
  /* Toplam, silinmiş kategorilerdeki kayıtları da sayar. Yoksa karne ile
     dönem toplamı birbirini tutmaz. */
  Object.keys(spent).forEach(function(k){
    spT+=spent[k];
    if(!known[k]){ bilinmeyen+=spent[k]; bnAd.push(k); }
  });
  return {inside:inside,over:over,names:names,lim:n.hb,sp:spT,bilinmeyen:bilinmeyen,bnAd:bnAd};
}

  if(!R.ozel) R.pids.forEach(function(k){
    if(!S.plans[k]) return;
    var ft=fundTargets(k); Object.keys(ft).forEach(function(f){ fh[f]=(fh[f]||0)+ft[f].hedef; });
  });
  var tU=0; Object.keys(uz).forEach(function(k){tU+=uz[k];});
  var tF=0; Object.keys(fn).forEach(function(k){tF+=fn[k];});
  var h='<div class="card"><h2>Aralıktaki yatırımlar</h2><p class="sub">Net tutar, alışlardan satış gelirleri düşülerek bulunur.'+(R.ozel?'':' Hedefler aralıktaki dönem planlarının toplamıdır.')+'</p>';
  h+='<div class="stat2"><div><p class="lbl">Hedeflenen</p><p class="mid gold">'+tl(tU)+'</p>'+(R.ozel?'':'<p class="lbl">Hedef '+tl(L.bb)+'</p>')+'</div>';
  h+='<div><p class="lbl">Harcama fonları</p><p class="mid">'+tl(tF)+'</p>'+(R.ozel?'':'<p class="lbl">Hedef '+tl(sum(Object.keys(fh),function(k){return fh[k];}))+'</p>')+'</div></div>';
  h+='<h3>Hedeflenen</h3>';
  var ids={}; Object.keys(uz).forEach(function(k){ids[k]=1;}); Object.keys(L.sc).forEach(function(k){ if(L.sc[k]>0) ids[k]=1; });
  var ks=Object.keys(ids).sort(function(a,b){return (uz[b]||0)-(uz[a]||0);});
  if(!ks.length) h+='<div class="empty">Kayıt yok.</div>';
  ks.forEach(function(k){
    var m=savById(k), v=uz[k]||0, lim=L.sc[k]||0;
    h+='<div class="catrow"><div class="between"><span class="catname">'+esc(m?m.n:'Silinmiş kategori')+'</span><span class="catnums">'+tl(v)+(R.ozel?'':' / '+tl(lim))+'</span></div>'+
       (R.ozel?barHtml(v,tU,true):barHtml(v,lim,true))+'</div>';
  });
  h+='<h3>Harcama fonları</h3>';
  S.funds.forEach(function(f){
    var v=fn[f.id]||0, lim=fh[f.id]||0;
    if(!v && !lim) return;
    h+='<div class="catrow"><div class="between"><span class="catname">'+esc(f.n)+'</span><span class="catnums">'+tl(v)+(R.ozel?'':' / '+tl(lim))+'</span></div>'+
       (R.ozel?barHtml(v,tF||1,true):barHtml(v,lim,true))+'</div>';
  });
  h+='</div>';
  return h;
}
function cumCard(){
  var h='<div class="card"><h2>Birikmiş net yatırım</h2><p class="sub">Tüm dönemler. Alışlardan satış gelirleri düşülerek biriken tutar. Mavi çizgi lira, sarı çizgi her işlemin kendi kuruyla dolar karşılığı.</p>';
  var all=S.invests.slice();
  if(all.length<2) return h+'<div class="empty">Grafik için en az iki yatırım kaydı gerekiyor.</div></div>';
  h+=lineChart([{color:'#2C5673',pts:cumSeries(all,function(i){return netTl(i);})}],tl);
  h+='<div class="legend"><span><s style="background:#2C5673"></s>Net yatırım ₺</span></div>';
  h+='<div style="margin-top:14px">'+lineChart([{color:'#A8812B',pts:cumSeries(all,function(i){return i.usd?netTl(i)/i.usd:0;})}],usd)+'</div>';
  h+='<div class="legend"><span><s style="background:#A8812B"></s>Net yatırım $</span></div>';
  h+='</div>';
  return h;
}
var ivRepSel='';
function itemCard(){
  var opts=[];
  S.savingCats.forEach(function(c){opts.push({v:'uzun|'+c.id,n:c.n});});
  S.funds.forEach(function(f){opts.push({v:'fon|'+f.id,n:f.n});});
  if(!ivRepSel || !opts.some(function(o){return o.v===ivRepSel;})) ivRepSel=(opts[0]||{}).v||'';
  var h='<div class="card"><h2>Kalem bazında</h2><p class="sub">Bir kalemi seçin, maliyetini, güncel değerini ve işlemlerini görün.</p>';
  h+='<label class="f"><select id="ivRepSel" onchange="ivRepSel=this.value;drawIvHist()">'+opts.map(function(o){return '<option value="'+o.v+'"'+(o.v===ivRepSel?' selected':'')+'>'+esc(o.n)+'</option>';}).join('')+'</select></label>';
  h+='<div id="ivHist"></div></div>';
  setTimeout(drawIvHist,0);
  return h;
}
function drawIvHist(){
  var box=document.getElementById('ivHist'); if(!box)return;
  var parts=document.getElementById('ivRepSel').value.split('|');
  var list=S.invests.filter(function(i){return i.bucket===parts[0]&&i.cat===parts[1];});
  if(!list.length){ box.innerHTML='<div class="empty">Bu kalemde kayıt yok.</div>'; return; }
  var m=holdings(parts[0]), sub={};
  Object.keys(m).forEach(function(k){ if(m[k].cat===parts[1]) sub[k]=m[k]; });
  var h=Object.keys(sub).length>1?totalsBlock(holdTotals(sub)):'';
  Object.keys(sub).sort().forEach(function(k){ h+=holdRow(sub[k]); });
  if(list.length>=2){
    h+='<div style="margin-top:12px">'+lineChart([{color:'#2E6B50',pts:cumSeries(list,function(i){return netTl(i);})}],tl)+'</div>';
    h+='<div class="legend"><span><s style="background:#2E6B50"></s>Net yatırım ₺</span></div>';
  }
  h+='<h3>İşlemler</h3>';
  list.slice().sort(function(a,b){return a.date<b.date?1:-1;}).slice(0,30).forEach(function(i){ h+=investItem(i); });
  if(list.length>30) h+='<p class="lbl">Son 30 işlem gösteriliyor. Tamamı için CSV indirin.</p>';
  box.innerHTML=h;
}
/* =====================  AYARLAR  ===================== */
function viewAyar(){
  var h='<div class="card"><h2>Kategoriler</h2><p class="sub">Kategori adları tüm dönemler için geçerli. Yüzdeler ve birikim alt oranları dönem bazında Planlama sekmesinden değişir.</p>';
  h+='<button class="wide ghost" onclick="manageCats(\'expenseCats\')">Harcama kategorileri</button>';
  h+='<div style="height:8px"></div><button class="wide ghost" onclick="manageCats(\'savingCats\')">Birikim kategorileri</button>';
  h+='<div style="height:8px"></div><button class="wide ghost" onclick="manageFunds()">Fon hesapları</button></div>';

  var kart=S.accounts.filter(function(a){return !a.off&&a.t==='kart';}).length, hes=S.accounts.filter(function(a){return !a.off&&a.t==='hesap';}).length;
  h+='<div class="card"><h2>Kartlar ve hesaplar</h2><p class="sub">'+kart+' kart, '+hes+' hesap. Harcama ve yatırım girerken bu listeden seçim yaparsınız.</p>';
  h+='<button class="wide ghost" onclick="manageAccounts()">Kartları ve hesapları düzenle</button></div>';

  h+='<div class="card"><h2>Yedek</h2><p class="sub">Tüm veriyi bir dosyaya alın. Telefon değiştirdiğinizde veya tarayıcı verisi silindiğinde bu dosyadan geri yükleyin.</p>';
  h+='<button class="wide" onclick="exportData()">Yedeği indir</button>';
  h+='<div style="height:8px"></div><label class="f"><span>Yedek dosyasından yükle</span><input type="file" id="impFile" accept="application/json" onchange="importData(this)"></label>';
  var eski=null; try{ eski=memOnly?null:localStorage.getItem(KEY+'_eski'); }catch(e){}
  if(eski) h+='<button class="wide ghost slim" onclick="exportOld()">Güncelleme öncesi kopyayı indir</button>';
  h+='</div>';

  var stat=[S.expenses.length+' harcama kaydı',S.invests.length+' yatırım kaydı',Object.keys(S.plans).length+' dönem planı'];
  h+='<div class="card"><h2>Veri</h2><p class="sub">'+stat.join(' · ')+'</p>';
  h+='<button class="wide danger" onclick="wipe()">Tüm verileri sil</button></div>';

  h+='<div class="card"><h2>Dönem kuralı</h2><p class="sub">Dönem ayın 16\'sında başlar, ertesi ayın 15\'inde biter. Maaş dönemin son günü yatar, ödemeler o gün yapılır. Dönem adı bitiş ayından gelir. 16 Eylül ile 15 Ekim arası Ekim bütçesidir.</p>';
  h+='<p class="sub" style="margin:0">Uygulama kendiliğinden yeni döneme geçmez. Yeni dönem, planını onayladığınızda başlar. Kayıtlar tarihine göre ait olduğu döneme yazılır.</p></div>';
  return h;
}
function manageCats(kind){
  var list=S[kind], sav=kind==='savingCats';
  var h='<h2>'+(sav?'Birikim':'Harcama')+' kategorileri</h2>';
  h+='<p class="sub">'+(sav
    ? 'Burada kategori adları değişir. Alt kalemler ve oranları Planlama sekmesindeki Alt oranlar düğmesinden, dönem bazında ayarlanır.'
    : 'Kategori ve alt kalem adlarını değiştirin. Alt kalemleri virgülle ayırın.')+'</p><div id="mcList">';
  list.forEach(function(c){
    var subs=(c.subs||[]).map(function(s){return typeof s==='string'?s:s.n;}).join(', ');
    h+='<div class="catrow" data-id="'+c.id+'">'+
       '<input type="text" data-f="n" value="'+esc(c.n)+'">'+
       (sav?'':'<input type="text" data-f="subs" value="'+esc(subs)+'" placeholder="Alt kalemler" style="margin-top:5px">')+
       '<div class="row" style="margin-top:5px;justify-content:flex-end"><button class="ghost slim" onclick="dropCatRow(this,\''+kind+'\',\''+c.id+'\')">Kategoriyi kaldır</button></div></div>';
  });
  h+='</div><button class="ghost slim" onclick="addCatRow(\''+kind+'\')">Kategori ekle</button>';
  h+='<div class="row" style="margin-top:14px"><button class="ghost grow" onclick="closeSheet()">Vazgeç</button><button class="grow" onclick="saveCatsMeta(\''+kind+'\')">Kaydet</button></div>';
  openSheet(h);
}
function addCatRow(kind){
  var id='c'+Date.now().toString(36);
  var d=document.createElement('div');
  d.className='catrow'; d.dataset.id=id;
  d.innerHTML='<input type="text" data-f="n" placeholder="Kategori adı">'+
    (kind==='savingCats'?'':'<input type="text" data-f="subs" placeholder="Alt kalemler" style="margin-top:5px">')+
    '<div class="row" style="margin-top:5px;justify-content:flex-end"><button class="ghost slim" onclick="this.closest(\'.catrow\').remove()">Kategoriyi kaldır</button></div>';
  document.getElementById('mcList').appendChild(d);
}
function dropCatRow(btn,kind,id){
  var n = kind==='expenseCats'
    ? S.expenses.filter(function(e){return e.cat===id;}).length
    : S.invests.filter(function(i){return i.cat===id;}).length;
  if(n && !confirm('Bu kategoride '+n+' kayıt var. Kategoriyi kaldırırsanız kayıtlar silinmez ama adı kaybolur, raporlarda kod olarak görünür. Devam edilsin mi?')) return;
  btn.closest('.catrow').remove();
}
function saveCatsMeta(kind){
  var out=[], old=S[kind], sav=kind==='savingCats';
  document.getElementById('mcList').querySelectorAll('.catrow').forEach(function(r){
    var id=r.dataset.id;
    var n=r.querySelector('[data-f=n]').value.trim(); if(!n)return;
    var prev=old.filter(function(c){return c.id===id;})[0]||{};
    var subsEl=r.querySelector('[data-f=subs]');
    var subs = sav ? clone(prev.subs||[])
      : (subsEl?subsEl.value.split(',').map(function(x){return x.trim();}).filter(Boolean):(prev.subs||[]));
    out.push({id:id,n:n,p:prev.p||0,unit:prev.unit||'adet',subs:subs,fund:prev.fund});
  });
  S[kind]=out;
  Object.keys(S.plans).forEach(function(pid){
    var key=kind==='expenseCats'?'ec':'sc', pl=S.plans[pid];
    pl[key]=out.map(function(c){
      var ex=pl[key].filter(function(x){return x.id===c.id;})[0];
      return {id:c.id,p:ex?ex.p:0};
    });
    if(sav){
      if(!pl.subs) pl.subs={};
      out.forEach(function(c){ if(!pl.subs[c.id]) pl.subs[c.id]=clone(c.subs||[]); });
    }
  });
  save(); closeSheet(); render();
}
function manageFunds(){
  var h='<h2>Fon hesapları</h2><p class="sub">Her fonun hedefi, bağlı olduğu harcama kategorisinin dönem limitidir.</p><div id="fnList">';
  S.funds.forEach(function(f){
    h+='<div class="catrow" data-id="'+f.id+'"><input type="text" data-f="n" value="'+esc(f.n)+'">'+
       '<input type="text" data-f="v" value="'+esc(f.v)+'" placeholder="Araç (fon kodu, hesap)" style="margin-top:5px">'+
       '<select data-f="src" style="margin-top:5px">'+
       S.expenseCats.map(function(c){return '<option value="'+c.id+'"'+(c.id===f.src?' selected':'')+'>Hedef: '+esc(c.n)+'</option>';}).join('')+
       '<option value="artan"'+(f.src==='artan'?' selected':'')+'>Hedef: harcamadan artan</option></select></div>';
  });
  h+='</div><div class="row" style="margin-top:14px"><button class="ghost grow" onclick="closeSheet()">Vazgeç</button><button class="grow" onclick="saveFunds()">Kaydet</button></div>';
  openSheet(h);
}
function saveFunds(){
  document.getElementById('fnList').querySelectorAll('.catrow').forEach(function(r){
    var f=fundById(r.dataset.id); if(!f)return;
    f.n=r.querySelector('[data-f=n]').value.trim()||f.n;
    f.v=r.querySelector('[data-f=v]').value.trim();
    f.src=r.querySelector('[data-f=src]').value;
  });
  save(); closeSheet(); render();
}
function manageAccounts(){
  var h='<h2>Kartlar ve hesaplar</h2><p class="sub">Kaldırdığınız kart seçim listesinden çıkar. Eski kayıtlarda ve raporlarda adı görünmeye devam eder.</p><div id="acList">';
  S.accounts.filter(function(a){return !a.off;}).forEach(function(a){ h+=accRow(a); });
  h+='</div><div class="row" style="gap:8px"><button class="ghost slim" onclick="addAccRow(\'kart\')">Kart ekle</button><button class="ghost slim" onclick="addAccRow(\'hesap\')">Hesap ekle</button></div>';
  h+='<div class="row" style="margin-top:14px"><button class="ghost grow" onclick="closeSheet()">Vazgeç</button><button class="grow" onclick="saveAccounts()">Kaydet</button></div>';
  openSheet(h);
}
function accRow(a){
  var n=a.id?accUse(a.id):0;
  return '<div class="catrow acrow" data-id="'+esc(a.id||'')+'"><div class="row">'+
    '<input type="text" class="grow" data-f="n" value="'+esc(a.n||'')+'" placeholder="'+(a.t==='hesap'?'Hesap adı':'Kart adı')+'">'+
    '<select data-f="t" style="width:auto;flex:none"><option value="kart"'+(a.t!=='hesap'?' selected':'')+'>Kart</option><option value="hesap"'+(a.t==='hesap'?' selected':'')+'>Hesap</option></select>'+
    '<button class="ghost slim" aria-label="Kaldır" onclick="this.closest(\'.acrow\').remove()">×</button></div>'+
    (n?'<p class="lbl" style="margin-top:3px">'+n+' kayıtta kullanılıyor</p>':'')+'</div>';
}
function addAccRow(t){
  var d=document.createElement('div'); d.innerHTML=accRow({id:'',n:'',t:t});
  var row=d.firstChild; document.getElementById('acList').appendChild(row);
  row.querySelector('[data-f=n]').focus();
}
function saveAccounts(){
  var seen={};
  document.getElementById('acList').querySelectorAll('.acrow').forEach(function(r,ix){
    var id=r.dataset.id, n=r.querySelector('[data-f=n]').value.trim(), t=r.querySelector('[data-f=t]').value;
    if(!n) return;
    var a=id?accById(id):null;
    if(a){ a.n=n; a.t=t; a.off=false; seen[a.id]=1; }
    else { var nid='a'+Date.now().toString(36)+ix; S.accounts.push({id:nid,n:n,t:t}); seen[nid]=1; }
  });
  S.accounts.forEach(function(a){ if(!seen[a.id]) a.off=true; });
  if(S.lastAcc.h && !seen[S.lastAcc.h]) S.lastAcc.h='';
  if(S.lastAcc.y && !seen[S.lastAcc.y]) S.lastAcc.y='';
  save(); closeSheet(); render();
}
function exportData(){
  download(JSON.stringify(S,null,1),'application/json','butce-yedek-'+today()+'.json');
}
function exportOld(){
  var raw=null; try{ raw=localStorage.getItem(KEY+'_eski'); }catch(e){}
  if(!raw){ alert('Güncelleme öncesi kopya bulunamadı.'); return; }
  download(raw,'application/json','butce-guncelleme-oncesi.json');
}
function importData(input){
  var f=input.files[0]; if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d.v || !d.plans || !Array.isArray(d.expenses)) throw new Error('format');
      if(!confirm('Mevcut veriler yedekteki verilerle değiştirilecek. Devam edilsin mi?'))return;
      S=migrate(d); save(); render(); toast('Yedek yüklendi.');
    }catch(e){ alert('Dosya okunamadı. Bu uygulamadan alınmış bir yedek dosyası seçin.'); }
  };
  r.readAsText(f);
}
function wipe(){
  if(!confirm('Bütün harcama, yatırım ve plan kayıtları silinecek. Devam edilsin mi?'))return;
  if(!confirm('Son onay. Yedek aldınız mı?'))return;
  S=defaults(); save(); render();
}

/* ---------- başlat ---------- */
getPlan(curPid(),true);
render();
</script>
